<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
  /* preload the faces we actually draw with */
  .pf{position:absolute;left:-9999px;top:-9999px;font-size:8px}
</style>
</head>
<body>
<canvas id="out" width="1920" height="804"></canvas>
<div class="pf">
  <span style="font-family:'Inter';font-weight:400">a</span>
  <span style="font-family:'Inter';font-weight:500">a</span>
  <span style="font-family:'Inter';font-weight:600">a</span>
  <span style="font-family:'Inter Display';font-weight:500">a</span>
  <span style="font-family:'Inter Display';font-weight:600">a</span>
  <span style="font-family:'JetBrains Mono';font-weight:400">a</span>
  <span style="font-family:'JetBrains Mono';font-weight:500">a</span>
</div>
<script src="core.js"></script>
<script src="scenes_a.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script src="post.js"></script>
<script src="timeline.js"></script>
<script>
  window.__ready = false;
  (async () => {
    await document.fonts.load("400 20px 'Inter'");
    await document.fonts.load("500 20px 'Inter'");
    await document.fonts.load("600 20px 'Inter'");
    await document.fonts.load("500 20px 'Inter Display'");
    await document.fonts.load("400 20px 'JetBrains Mono'");
    await document.fonts.load("500 20px 'JetBrains Mono'");
    await document.fonts.ready;
    window.__ready = true;
  })();
  window.__setup = (name) => { setupCut(name); return { w: DEV.W, h: DEV.H, fps: CUT.fps }; };
  window.__frame = (t, i) => { renderFrame(t, i); };
</script>
</body>
</html>
